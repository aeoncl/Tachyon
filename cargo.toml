[workspace]
members = [
    "crates/tachyon",
    "crates/msnp"
, "crates/tachyon-core", "crates/tachyon-backend-matrix", "crates/tachyon-bridge-msn", "crates/tachyon-web", "crates/tachyon-store-sqlite", "crates/tachyon-testkit"]

default-members = [
    "crates/tachyon",
    "crates/msnp",
    "crates/tachyon-core",
    "crates/tachyon-backend-matrix",
    "crates/tachyon-bridge-msn",
    "crates/tachyon-web",
    "crates/tachyon-store-sqlite",
    "crates/tachyon-testkit"
]

exclude = [
    "lib/matrix-rust-sdk"
]
resolver = "2"

[workspace.dependencies]
anyhow= "1.0.75"
thiserror = "1.0.58"
env_logger = "0.11.3"
lazy_static = "1.4.0"
lazy-static-include = "3.2.1"
regex = "1.10.2"
urlencoding = "2.1.3"
log = "0.4.21"
chrono = "0.4.41"
tokio = { version = "1.50.0", features = ["full", "tracing"] }
tokio-util = "0.7.19"

